name: AI Reply On Comment

on:
  discussion_comment:
    types:
      - created

jobs:
  ai-reply-comment:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      discussions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and publish AI reply
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_AUTHOR_LOGIN: "imlevv"
        run: |
          python scripts/post_ai_reply_comment.py \
            --event-path "${GITHUB_EVENT_PATH}" \
            --allowed-comment-author "dplvoah" \
            --ai-author-login "imlevv"
