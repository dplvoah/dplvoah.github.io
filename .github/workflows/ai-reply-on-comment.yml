name: AI Reply On Comment

env:
  AI_AUTHOR_LOGIN: "imlevv"

on:
  discussion_comment:
    types:
      - created

jobs:
  ai-reply-comment:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Generate and publish AI reply
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/post_ai_reply_comment.py \
            --event-path "${GITHUB_EVENT_PATH}" \
            --ai-author-login "${AI_AUTHOR_LOGIN}"

      - name: Commit runtime memory updates
        run: |
          if [ -z "$(git status --porcelain -- ai_context/recent_memory.md ai_context/memory/interaction_events.jsonl)" ]; then
            echo "No runtime memory changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai_context/recent_memory.md
          if [ -f "ai_context/memory/interaction_events.jsonl" ]; then
            git add ai_context/memory/interaction_events.jsonl
          fi
          git commit -m "chore: refresh runtime memory after reply [skip ai-comment]"
          git push
