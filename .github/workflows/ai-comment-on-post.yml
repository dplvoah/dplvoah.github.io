name: AI Comment On Post

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Blog post slug"
        required: true
        type: string

  push:
    branches:
      - main
    paths:
      - "src/content/blog/*.md"
      - "scripts/**/*.py"
      - "ai_context/*.md"
      - "requirements.txt"
      - ".github/workflows/ai-comment-on-post.yml"

jobs:
  post-ai-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slug
        id: resolve_slug
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ inputs.slug }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_PATH=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep '^src/content/blog/.*\.md$' | tail -n 1 || true)

          if [ -z "$FILE_PATH" ]; then
            echo "No blog markdown file changed."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_NAME=$(basename "$FILE_PATH")
          SLUG="${FILE_NAME%.md}"

          echo "Resolved slug: $SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Skip when no slug resolved
        if: steps.resolve_slug.outputs.slug == ''
        run: echo "No target slug resolved. Skip posting AI comment."

      - name: Generate and publish AI comment
        if: steps.resolve_slug.outputs.slug != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
        run: |
          python scripts/post_ai_comment.py --slug "${{ steps.resolve_slug.outputs.slug }}" --write-file