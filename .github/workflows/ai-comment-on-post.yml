name: AI Comment On Post

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      slug:
        description: "Blog post slug"
        required: false
        type: string
        default: ""

jobs:
  post-ai-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug current git revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: Resolve target slugs
        id: resolve-slugs
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SLUG: ${{ github.event.inputs.slug || '' }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_SLUG" ]; then
            slugs="$MANUAL_SLUG"
          else
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" -- 'src/content/blog/*.md')
            else
              changed_files=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- 'src/content/blog/*.md')
            fi

            slugs=$(printf '%s\n' "$changed_files" \
              | sed -n 's#^src/content/blog/\(.*\)\.md$#\1#p' \
              | sort -u \
              | paste -sd ' ' -)
          fi

          echo "resolved_slugs=$slugs" >> "$GITHUB_OUTPUT"

          if [ -n "$slugs" ]; then
            echo "has_slugs=true" >> "$GITHUB_OUTPUT"
            echo "Target slugs: $slugs"
          else
            echo "has_slugs=false" >> "$GITHUB_OUTPUT"
            echo "No changed blog markdown files in this push."
          fi

      - name: Debug markdown payload
        if: steps.resolve-slugs.outputs.has_slugs == 'true'
        run: |
          for slug in ${{ steps.resolve-slugs.outputs.resolved_slugs }}; do
            echo "=== RAW FILE ($slug) ==="
            cat "src/content/blog/${slug}.md"
            echo
            echo "=== PARSED FILE ($slug) ==="
            python scripts/load_markdown.py --slug "${slug}" --pretty
            echo
          done

      - name: Generate and publish AI comment
        if: steps.resolve-slugs.outputs.has_slugs == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          for slug in ${{ steps.resolve-slugs.outputs.resolved_slugs }}; do
            python scripts/post_ai_comment.py \
              --slug "${slug}" \
              --repo-owner "${{ github.repository_owner }}" \
              --repo-name "${{ github.event.repository.name }}" \
              --write-file
          done
