name: AI Comment On Post

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      slug:
        description: "Blog post slug"
        required: false
        type: string
        default: ""

jobs:
  post-ai-comment:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug current git revision
        run: |
          git rev-parse HEAD
          git branch --show-current

      - name: Resolve target slugs
        id: resolve-slugs
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SLUG: ${{ github.event.inputs.slug || '' }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_SLUG" ]; then
            slugs="$MANUAL_SLUG"
          else
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" -- 'src/content/blog/*.md')
            else
              changed_files=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- 'src/content/blog/*.md')
            fi

            changed_slugs=$(printf '%s\n' "$changed_files" \
              | sed -n 's#^src/content/blog/\(.*\)\.md$#\1#p' \
              | sort -u \
              | paste -sd ' ' -)

            missing_discussion_slugs=$(python -c "from pathlib import Path; import re; p=re.compile(r'^---\\r?\\n(.*?)\\r?\\n---\\r?\\n?(.*)$', re.DOTALL); print(' '.join(path.stem for path in sorted(Path('src/content/blog').glob('*.md')) if (m:=p.match(path.read_text(encoding='utf-8'))) and not re.search(r'(?m)^\\s*discussionId\\s*:', m.group(1))))")

            slugs=$(printf '%s\n%s\n' "$changed_slugs" "$missing_discussion_slugs" \
              | tr ' ' '\n' \
              | sed '/^$/d' \
              | sort -u \
              | paste -sd ' ' -)
          fi

          echo "resolved_slugs=$slugs" >> "$GITHUB_OUTPUT"

          if [ -n "$slugs" ]; then
            echo "has_slugs=true" >> "$GITHUB_OUTPUT"
            echo "Target slugs: $slugs"
          else
            echo "has_slugs=false" >> "$GITHUB_OUTPUT"
            echo "No changed blog markdown files in this push."
          fi

      - name: Debug markdown payload
        if: steps.resolve-slugs.outputs.has_slugs == 'true'
        run: |
          for slug in ${{ steps.resolve-slugs.outputs.resolved_slugs }}; do
            echo "=== RAW FILE ($slug) ==="
            cat "src/content/blog/${slug}.md"
            echo
            echo "=== PARSED FILE ($slug) ==="
            python scripts/load_markdown.py --slug "${slug}" --pretty
            echo
          done

      - name: Generate and publish AI comment
        if: steps.resolve-slugs.outputs.has_slugs == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GISCUS_CATEGORY: "Comments"
          GISCUS_CATEGORY_ID: "DIC_kwDOR8zCy84C6Xkq"
        run: |
          for slug in ${{ steps.resolve-slugs.outputs.resolved_slugs }}; do
            python scripts/post_ai_comment.py \
              --slug "${slug}" \
              --repo-owner "${{ github.repository_owner }}" \
              --repo-name "${{ github.event.repository.name }}" \
              --discussion-category-id "${GISCUS_CATEGORY_ID}" \
              --discussion-category-name "${GISCUS_CATEGORY}" \
              --write-file
          done

      - name: Commit discussionId backfill
        if: steps.resolve-slugs.outputs.has_slugs == 'true'
        run: |
          if git diff --quiet -- src/content/blog/*.md; then
            echo "No discussionId backfill changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/*.md
          git commit -m "chore: backfill discussionId [skip ai-comment]"
          git push
